services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ledning_test
      POSTGRES_USER: ledning
      POSTGRES_PASSWORD: test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ../../db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledning"]
      interval: 2s
      timeout: 3s
      retries: 30
