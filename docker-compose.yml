version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ledning
      POSTGRES_USER: ledning
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledning"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      TZ: Europe/Stockholm
      DATABASE_URL: postgresql://ledning:${DB_PASSWORD}@db:5432/ledning
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      TRAFIKVERKET_API_KEY: ${TRAFIKVERKET_API_KEY}
      TRAFIKVERKET_DATEX_KEY: ${TRAFIKVERKET_DATEX_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      ELKS_API_USERNAME: ${ELKS_API_USERNAME}
      ELKS_API_PASSWORD: ${ELKS_API_PASSWORD}
      ELKS_FROM: ${ELKS_FROM}
      PLATFORM_ADMIN_JWT_SECRET: ${PLATFORM_ADMIN_JWT_SECRET}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD}
      FEATURE_CRITICAL_ALERTS: ${FEATURE_CRITICAL_ALERTS:-false}
      FEATURE_TAKY_BRIDGE: ${FEATURE_TAKY_BRIDGE:-false}
      TAKY_HOST: ${TAKY_HOST:-192.168.1.140}
      TAKY_COT_PORT: ${TAKY_COT_PORT:-8089}
      TAKY_CLIENT_CERT_PATH: /app/certs/taky/client.crt
      TAKY_CLIENT_KEY_PATH: /app/certs/taky/client.key
      TAKY_CA_CERT_PATH: /app/certs/taky/ca.crt
      PORT: 3000
    volumes:
      - uploads_data:/app/uploads
      - ./certs/taky:/app/certs/taky:ro
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ""
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads_data:
